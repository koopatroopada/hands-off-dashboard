<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta
    name="description"
    content="Hands-off Dashboard：读取本地项目交接文档的只读看板，展示当前阶段、证据、阻塞项与下一步动作。"
  />
  <title>Hands-off Dashboard · 项目交接看板</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f5f5f7;
      --surface-warm: #fbfbfd;

      --fg: #1d1d1f;
      --fg-2: #424245;
      --muted: #6e6e73;
      --meta: #86868b;

      --border: #d2d2d7;
      --border-soft: #e8e8ed;

      --accent: #0071e3;
      --accent-on: #ffffff;
      --accent-hover: #0077ed;
      --accent-active: #0066cc;

      --success: #16a34a;
      --warn: #eab308;
      --danger: #dc2626;

      --warning-ink: #7a5c2e;
      --warning-surface: #fbf7ef;
      --warning-border: #e8ddc9;

      --font-display:
        "SF Pro Display", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-body:
        "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-cjk:
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-ui:
        "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
        "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-display-ui:
        "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
        "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-mono:
        "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Monaco, Consolas, monospace;

      --text-xs: 12px;
      --text-sm: 14px;
      --text-base: 17px;
      --text-lg: 21px;
      --text-xl: 28px;
      --text-2xl: 40px;
      --text-3xl: 56px;
      --text-4xl: 80px;

      --leading-body: 1.47;
      --leading-tight: 1.05;
      --tracking-display: -0.015em;

      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-12: 48px;

      --section-y-desktop: 100px;
      --section-y-tablet: 64px;
      --section-y-phone: 40px;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-pill: 980px;

      --elev-flat: none;
      --elev-ring: 0 0 0 1px var(--border);
      --elev-raised: 0 12px 32px rgba(0, 0, 0, 0.08);

      --focus-ring: 0 0 0 4px color-mix(in oklab, var(--navy), transparent 72%);

      --motion-fast: 150ms;
      --motion-base: 220ms;
      --ease-standard: cubic-bezier(0.28, 0, 0.22, 1);

      --container-max: 1024px;
      --container-gutter-desktop: 22px;
      --container-gutter-tablet: 18px;
      --container-gutter-phone: 16px;

      /* Reference-led frame and board surfaces */
      --frame: #081124;
      --frame-mid: #0b1d2b;
      --frame-glow: rgba(35, 96, 111, 0.4);
      --page-bg:
        radial-gradient(1100px 640px at 78% -12%, var(--frame-glow), transparent 62%),
        linear-gradient(135deg, #081124 0%, #0b1d2b 52%, #091426 100%);
      --shell-border: rgba(255, 255, 255, 0.18);
      --shell-shadow:
        0 38px 90px rgba(0, 0, 0, 0.42),
        0 1px 0 rgba(255, 255, 255, 0.12) inset;
      --navy: #1b2a5e;
      --navy-hover: #243873;
      --navy-active: #142046;
      --stage-teal: #0f969f;
      --stage-ink: #0a6b72;
      --board: #f3f4f7;
      --board-border: #e7e9ef;
      --card: #ffffff;
      --card-border: #e8eaef;
      --card-shadow:
        0 6px 18px rgba(20, 28, 45, 0.06),
        0 1px 2px rgba(20, 28, 45, 0.04);
      --card-shadow-hover:
        0 10px 26px rgba(20, 28, 45, 0.08),
        0 1px 2px rgba(20, 28, 45, 0.04);
      --pin-surface: #f1f3f7;
      --control-border: #e5e7ed;
      --control-surface: #f5f6f8;
      --hairline-faint: #eef0f4;
      --scroll-thumb: #cbd0da;
      --navy-shadow-soft: 0 2px 6px rgba(27, 42, 94, 0.2);
      --navy-shadow-strong: 0 6px 14px rgba(27, 42, 94, 0.22);
      --glass: rgba(255, 255, 255, 0.56);
      --glass-strong: rgba(255, 255, 255, 0.74);
      --glass-border: rgba(255, 255, 255, 0.84);
      --glass-hairline: rgba(29, 29, 31, 0.08);
      --glass-blur: blur(18px) saturate(135%);
      --glass-shadow:
        0 10px 30px rgba(20, 28, 45, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.86);
      --glass-shadow-hover:
        0 16px 38px rgba(20, 28, 45, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      --toggle-face: rgba(255, 255, 255, 0.6);
      --toggle-border: rgba(255, 255, 255, 0.9);
      --toggle-shadow:
        0 4px 10px rgba(20, 28, 45, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      --toggle-shadow-hover:
        0 6px 14px rgba(20, 28, 45, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.96);
      --board-bg:
        radial-gradient(900px 460px at 12% -10%, rgba(98, 139, 166, 0.18), transparent 62%),
        radial-gradient(760px 480px at 88% 110%, rgba(27, 42, 94, 0.12), transparent 64%),
        linear-gradient(180deg, #f3f4f7, #eef1f5);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background-color: var(--frame);
      background-image: var(--page-bg);
      color: var(--fg);
      font-family: var(--font-ui);
      font-size: var(--text-base);
      line-height: var(--leading-body);
      letter-spacing: -0.018em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    [hidden] { display: none !important; }
    p, h1, h2, h3 { margin: 0; }
    button { font: inherit; }
    time { font-variant-numeric: tabular-nums; }

    .od-icon {
      width: var(--od-icon-size, 1em);
      height: var(--od-icon-size, 1em);
      flex: none;
      display: inline-block;
      vertical-align: middle;
    }
    .icon-pin { --od-icon-size: 18px; }
    .icon-arrow { --od-icon-size: 14px; }
    .icon-warning { --od-icon-size: 17px; }
    .icon-chevron { --od-icon-size: 14px; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ── Frame and application shell ─────────────────────────── */
    .stage {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      padding: 24px;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    .app-shell {
      width: min(1480px, 100%);
      height: 100%;
      min-height: 0;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--shell-border);
      border-radius: 26px;
      background: var(--card);
      box-shadow: var(--shell-shadow);
    }

    /* ── Header ──────────────────────────────────────────────── */
    .app-header {
      flex: 0 0 auto;
      padding: 18px 28px;
      background: var(--card);
      border-bottom: 1px solid var(--border-soft);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-width: 0;
    }

    .header-lead {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1 1 auto;
      min-width: 0;
    }

    .view-switch {
      appearance: none;
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      min-height: 36px;
      margin-top: 0;
      padding: 0;
      border: 1px solid var(--control-border);
      border-radius: 10px;
      background: var(--control-surface);
      color: var(--fg-2);
      font: inherit;
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.2;
      cursor: pointer;
      white-space: nowrap;
      transition:
        background-color var(--motion-fast) var(--ease-standard),
        border-color var(--motion-fast) var(--ease-standard),
        color var(--motion-fast) var(--ease-standard),
        box-shadow var(--motion-fast) var(--ease-standard);
    }

    .view-switch::before {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 12px;
    }

    .view-switch:hover {
      background: var(--bg);
      border-color: var(--border);
      color: var(--fg);
    }

    .view-switch:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }

    .view-switch-icon {
      --od-icon-size: 15px;
      color: var(--meta);
      transition: color var(--motion-fast) var(--ease-standard);
    }

    .view-switch:hover .view-switch-icon {
      color: var(--fg-2);
    }

    .view-switch .icon-view-board { display: none; }

    .app-shell.is-gallery .view-switch .icon-view-gallery { display: none; }
    .app-shell.is-gallery .view-switch .icon-view-board { display: inline-block; }

    .header-aside {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px 10px;
      flex: 0 0 auto;
      min-width: 0;
    }

    .demo-badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 3px 9px;
      border: 1px solid var(--control-border);
      border-radius: var(--radius-pill);
      background: var(--control-surface);
      color: var(--muted);
      font-size: 10.5px;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brandmark {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      border-radius: 12px;
      background: var(--navy);
      color: var(--accent-on);
      box-shadow: var(--navy-shadow-strong);
    }

    .brandmark svg {
      width: 30px;
      height: 30px;
    }

    .brandmark .monogram {
      font-family: var(--font-mono);
      font-weight: 700;
      letter-spacing: 0;
      text-rendering: geometricPrecision;
    }

    .generated {
      flex: 0 0 auto;
      padding-top: 2px;
      font-size: 11.5px;
      line-height: 1.6;
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
    }

    .generated strong {
      color: var(--fg-2);
      font-weight: 500;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 1 auto;
      flex-wrap: wrap;
      min-width: 0;
    }

    .toolbar-label {
      font-size: 9.5px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-right: 1px;
    }

    .segmented {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 2px;
      border: 1px solid var(--control-border);
      border-radius: 9px;
      background: var(--control-surface);
    }

    .sort-button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--fg-2);
      min-height: 28px;
      padding: 5px 10px;
      border-radius: 7px;
      font-size: 11.5px;
      font-weight: 500;
      line-height: 1.2;
      cursor: pointer;
      white-space: nowrap;
      transition:
        background-color var(--motion-fast) var(--ease-standard),
        color var(--motion-fast) var(--ease-standard),
        box-shadow var(--motion-fast) var(--ease-standard);
    }

    .sort-button:hover {
      color: var(--fg);
      background: var(--bg);
    }

    .sort-button[aria-pressed="true"] {
      background: var(--navy);
      color: var(--accent-on);
      font-weight: 600;
      box-shadow: var(--navy-shadow-soft);
    }

    .sort-button[aria-pressed="true"]:hover {
      background: var(--navy-hover);
      color: var(--accent-on);
    }

    .sort-button:focus-visible,
    .direction-button:focus-visible,
    .pin:focus-visible,
    .why-toggle:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }

    .direction-button {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--card);
      color: var(--fg-2);
      font-size: 11.5px;
      font-weight: 500;
      line-height: 1.2;
      cursor: pointer;
      white-space: nowrap;
      transition:
        background-color var(--motion-fast) var(--ease-standard),
        border-color var(--motion-fast) var(--ease-standard);
    }

    .direction-button:hover {
      background: var(--surface);
      border-color: var(--meta);
    }

    .sort-arrow {
      --od-icon-size: 12px;
      transition: transform var(--motion-fast) var(--ease-standard);
    }

    .sort-arrow.is-ascending { transform: rotate(180deg); }

    .count-pill {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      min-height: 28px;
      margin-left: auto;
      margin-right: clamp(24px, 4vw, 48px);
      padding: 4px 12px;
      border: 1px solid var(--control-border);
      border-radius: var(--radius-pill);
      background: var(--control-surface);
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      line-height: 1.2;
      white-space: nowrap;
    }

    .project-count {
      min-height: 26px;
      margin-left: 2px;
      margin-right: 0;
      padding: 3px 10px;
      font-size: 10.5px;
    }

    .gallery-meta {
      display: none;
      margin-left: 0;
      margin-right: 0;
    }

    /* Gallery 视图：把页头收成一条工具带，让方格成为主角 */
    .app-shell.is-gallery .identity,
    .app-shell.is-gallery .controls,
    .app-shell.is-gallery .project-count {
      display: none;
    }

    .app-shell.is-gallery .app-header {
      padding-bottom: 14px;
      border-bottom-color: transparent;
    }

    .app-shell.is-gallery .header-top {
      align-items: center;
    }

    .app-shell.is-gallery .header-lead {
      flex: 0 0 auto;
    }

    .app-shell.is-gallery .view-switch {
      margin-top: 0;
    }

    .app-shell.is-gallery .generated {
      display: none;
    }

    .app-shell.is-gallery .gallery-meta {
      display: inline-flex;
    }

    .app-shell.is-gallery .board-scroller {
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-snap-type: none;
    }

    .app-shell.is-gallery .board-scroller::-webkit-scrollbar {
      width: 9px;
      height: 9px;
    }

    /* ── Board ───────────────────────────────────────────────── */
    .board-area {
      flex: 1 1 auto;
      min-height: 0;
      padding: 16px 24px 24px;
      background: var(--card);
    }

    .board-panel {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 12px;
      border: 1px solid var(--board-border);
      border-radius: 20px;
      background: var(--board-bg);
    }

    .board-scroller {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: thin;
      scrollbar-color: var(--scroll-thumb) transparent;
      overscroll-behavior-x: contain;
      border-radius: 12px;
      /* 不要设 touch-action: none / pan-x pan-y：前者让单指彻底滑不动，
         后者不含 pinch-zoom，卡片内纵滑时会吞掉横向手势。默认 auto 让
         浏览器按手势方向自行分发：横向滚看板，纵向滚卡片。 */
    }

    .board-scroller:focus-visible {
      outline: 2px solid var(--navy);
      outline-offset: -2px;
    }

    .board-scroller::-webkit-scrollbar { height: 9px; }
    .board-scroller::-webkit-scrollbar-track { background: transparent; }
    .board-scroller::-webkit-scrollbar-thumb {
      background: var(--scroll-thumb);
      border-radius: var(--radius-pill);
      border: 2px solid var(--board);
    }

    .board {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: max(180px, calc((100% - 36px) * 0.15));
      grid-template-rows: minmax(0, 1fr);
      gap: 12px;
      width: 100%;
      height: 100%;
    }

    .board.is-empty {
      display: grid;
      grid-auto-flow: row;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      grid-auto-columns: auto;
      grid-auto-rows: auto;
      place-items: center;
      width: 100%;
      min-width: 0;
    }

    /* ── Gallery（方格展示）─────────────────────────────────────
       宽度保持 140px；高度改由标题与阶段的占位决定，不再锁死为正方形：
       标题占几行，卡片就长多高，标题下方不留空白。 */
    .board.is-gallery {
      display: grid;
      grid-auto-flow: row;
      grid-template-columns: repeat(auto-fit, 140px);
      grid-template-rows: auto;
      grid-auto-columns: auto;
      grid-auto-rows: auto;
      justify-content: center;
      align-content: start;
      align-items: stretch;
      gap: 12px;
      width: 100%;
      height: auto;
      min-height: 100%;
      padding: 2px;
    }

    .gallery-tile {
      container-type: inline-size;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 8px;
      width: 100%;
      padding: clamp(11px, 8.6cqw, 14px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      background: var(--glass-strong);
      box-shadow: var(--glass-shadow);
      -webkit-backdrop-filter: var(--glass-blur);
      backdrop-filter: var(--glass-blur);
      overflow: hidden;
      transition:
        box-shadow var(--motion-base) var(--ease-standard),
        border-color var(--motion-base) var(--ease-standard);
    }

    @media (hover: hover) {
      .gallery-tile:hover {
        border-color: rgba(255, 255, 255, 0.96);
        box-shadow: var(--glass-shadow-hover);
      }
    }

    .gallery-head {
      display: flex;
      align-items: flex-start;
      gap: 4px;
      min-width: 0;
    }

    .gallery-head .gallery-name {
      flex: 1 1 auto;
      min-width: 0;
    }

    .gallery-tile.is-pinned {
      border-color: rgba(27, 42, 94, 0.28);
    }

    .gallery-name {
      margin: 0;
      font-family: var(--font-display-ui);
      font-size: clamp(13.5px, 11.4cqw, 16px);
      font-weight: 600;
      line-height: 1.24;
      letter-spacing: -0.02em;
      color: var(--fg);
      overflow-wrap: anywhere;
      text-wrap: pretty;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    .gallery-stage {
      min-width: 0;
      padding-top: 8px;
      border-top: 1px solid var(--glass-hairline);
    }

    .gallery-stage-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: 0.06em;
      color: var(--fg-2);
    }

    .gallery-stage-dot {
      width: 5px;
      height: 5px;
      flex: none;
      border-radius: 50%;
      background: var(--stage-teal);
    }

    .gallery-stage-name {
      margin-top: 5px;
      font-family: var(--font-display-ui);
      font-size: clamp(12px, 9cqw, 13.5px);
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: -0.01em;
      color: var(--stage-ink);
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    .gallery-stage-name.is-placeholder {
      color: var(--muted);
      font-weight: 500;
    }

    .gallery-tile.is-placeholder .gallery-stage-dot {
      background: var(--meta);
    }

    .gallery-tile.is-error .gallery-stage-dot {
      background: var(--danger);
    }

    .project {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 20px 16px 16px;
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      background: var(--glass);
      box-shadow: var(--glass-shadow);
      -webkit-backdrop-filter: var(--glass-blur);
      backdrop-filter: var(--glass-blur);
      overflow-y: auto;
      overscroll-behavior-y: contain;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
      transition: box-shadow var(--motion-base) var(--ease-standard);
    }

    @media (hover: hover) {
      .project:hover { box-shadow: var(--glass-shadow-hover); }
    }

    .project-head {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      min-width: 0;
    }

    .project-title {
      flex: 1 1 auto;
      min-width: 0;
      font-family: var(--font-display-ui);
      font-size: clamp(24px, 1.8vw, 27px);
      font-weight: 600;
      line-height: 1.12;
      letter-spacing: -0.03em;
      color: var(--fg);
      white-space: nowrap;
      display: block;
      overflow: hidden;
    }

    .title-track {
      display: inline-flex;
      align-items: baseline;
      gap: 32px;
      min-width: max-content;
      will-change: transform;
    }

    .title-text { white-space: nowrap; }

    .project-title:not(.is-scrolling) .title-text[aria-hidden="true"] {
      display: none;
    }

    .project-title.is-scrolling .title-track {
      animation: title-marquee var(--title-duration, 10s) linear infinite;
    }

    .project-title.is-scrolling:hover .title-track,
    .project-title.is-scrolling:focus-within .title-track,
    .project:hover .project-title.is-scrolling .title-track,
    .project:focus-within .project-title.is-scrolling .title-track {
      animation-play-state: paused;
    }

    @keyframes title-marquee {
      0%, 12% { transform: translateX(0); }
      88%, 100% { transform: translateX(calc(-1 * var(--title-shift, 0px))); }
    }

    .pin {
      appearance: none;
      position: relative;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      margin: -9px -9px 0 0;
      padding: 0;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--meta);
      cursor: pointer;
      transition:
        color var(--motion-fast) var(--ease-standard),
        background-color var(--motion-fast) var(--ease-standard);
    }

    /* 方格卡片更小，用紧凑尺寸，靠 ::before 把可点区域补到 44px。 */
    .pin.pin-tile {
      width: 28px;
      height: 28px;
      margin: -2px -2px 0 0;
      border-radius: 7px;
    }

    .pin.pin-tile .icon-pin { --od-icon-size: 15px; }

    .pin.pin-tile::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 12px;
    }

    .pin:hover {
      color: var(--navy);
      background: var(--glass-strong);
    }

    .pin[aria-pressed="true"] { color: var(--navy); }
    .pin[aria-pressed="true"] .pin-head { fill: currentColor; }

    .why {
      margin-top: 8px;
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--muted);
      letter-spacing: -0.012em;
      overflow-wrap: anywhere;
      display: block;
      max-height: 6.4em;
      min-height: 6.4em;
      overflow: hidden;
    }

    .why-wrap {
      position: relative;
      margin-top: 8px;
      font-size: 13.5px;
      line-height: 1.6;
    }

    .why-wrap .why {
      margin-top: 0;
    }

    .why.is-expanded {
      max-height: none;
      min-height: 0;
      overflow: visible;
    }

    .why-toggle {
      appearance: none;
      position: absolute;
      top: calc(6.4em - 28px);
      right: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      margin: 0;
      padding: 0;
      border: 1px solid var(--toggle-border);
      border-radius: 8px;
      background: var(--toggle-face);
      box-shadow: var(--toggle-shadow);
      -webkit-backdrop-filter: blur(8px) saturate(130%);
      backdrop-filter: blur(8px) saturate(130%);
      color: var(--muted);
      cursor: pointer;
      transition:
        color var(--motion-fast) var(--ease-standard),
        box-shadow var(--motion-fast) var(--ease-standard);
    }

    .why-toggle::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 12px;
    }

    .why-toggle:hover {
      color: var(--fg);
      box-shadow: var(--toggle-shadow-hover);
    }

    .why-toggle .chevron {
      transition: transform var(--motion-fast) var(--ease-standard);
    }

    .why-toggle[aria-expanded="true"] .chevron {
      transform: rotate(180deg);
    }

    .doc-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      min-width: 0;
    }

    .doc-link {
      appearance: none;
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      padding: 5px 9px;
      border: 1px solid var(--control-border);
      border-radius: 8px;
      background: var(--control-surface);
      color: var(--fg-2);
      font-family: var(--font-ui);
      font-size: 11.5px;
      font-weight: 500;
      line-height: 1.3;
      cursor: pointer;
      white-space: nowrap;
      transition:
        background-color var(--motion-fast) var(--ease-standard),
        border-color var(--motion-fast) var(--ease-standard),
        color var(--motion-fast) var(--ease-standard);
    }

    .doc-link:hover { background: var(--bg); border-color: var(--border); color: var(--fg); }
    .doc-link:focus-visible { outline: none; box-shadow: var(--focus-ring); }

    .doc-path {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--meta);
    }

    .block { margin-top: 20px; }

    .block-label {
      margin-bottom: 8px;
      font-size: 9.5px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .stage-line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .stage-name {
      min-width: 0;
      font-family: var(--font-display-ui);
      font-size: 18px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.018em;
      color: var(--stage-teal);
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    .stage-count {
      flex: 0 0 auto;
      font-size: 11.5px;
      font-weight: 500;
      line-height: 1.3;
      color: var(--muted);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .evidence {
      margin-top: 4px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--muted);
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    .gate {
      font-size: 12px;
      line-height: 1.5;
      color: var(--muted);
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    .next-action {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin-top: 8px;
      font-size: 13.5px;
      font-weight: 700;
      line-height: 1.55;
      color: var(--fg);
      letter-spacing: -0.012em;
      overflow-wrap: anywhere;
      min-width: 0;
    }

    .next-action .action-text {
      min-width: 0;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 32;
      overflow: hidden;
    }

    .next-action .action-arrow {
      color: var(--meta);
      margin-top: 0.32em;
    }

    .next-action.is-placeholder {
      color: var(--muted);
      font-weight: 400;
    }

    .undetermined {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border: 1px solid var(--warning-border);
      border-radius: 8px;
      background: var(--warning-surface);
      color: var(--warning-ink);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.45;
      letter-spacing: -0.008em;
    }

    .placeholder { color: var(--muted); }

    .project-footer {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--glass-hairline);
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 6px;
      font-size: 10.5px;
      line-height: 1.5;
      color: var(--muted);
    }

    .time-item { white-space: nowrap; }
    .footer-sep { color: var(--meta); }

    /* ── Empty state ─────────────────────────────────────────── */
    .empty-state {
      width: min(100%, 440px);
      padding: 40px 34px;
      border: 1px solid var(--card-border);
      border-radius: 18px;
      background: var(--card);
      box-shadow: var(--card-shadow);
      text-align: center;
    }

    .empty-mark {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      margin: 0 auto 18px;
      border: 1px solid var(--border);
      border-radius: 50%;
      color: var(--muted);
    }

    .empty-title {
      font-family: var(--font-display-ui);
      font-size: 22px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.025em;
      color: var(--fg);
    }

    .empty-copy {
      margin-top: 8px;
      font-size: 13px;
      line-height: 1.65;
      color: var(--muted);
      text-wrap: pretty;
    }

    .no-script {
      padding: 24px;
      color: var(--muted);
      font-size: 13px;
    }

    /* ── 全文抽屉 ───────────────────────────────────────────── */
    .drawer { position: fixed; inset: 0; z-index: 60; display: flex; justify-content: flex-end; }
    .drawer[hidden] { display: none; }

    .drawer-scrim {
      position: absolute;
      inset: 0;
      background: rgba(8, 17, 36, 0.46);
      opacity: 0;
      transition: opacity var(--motion-base) var(--ease-standard);
    }

    .drawer.is-open .drawer-scrim { opacity: 1; }

    .drawer-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      width: min(780px, 100%);
      height: 100%;
      background: var(--card);
      box-shadow: -24px 0 70px rgba(8, 17, 36, 0.3);
      opacity: 0;
      transform: translateX(26px);
      transition:
        transform var(--motion-base) var(--ease-standard),
        opacity 180ms var(--ease-standard);
    }

    .drawer.is-open .drawer-panel { opacity: 1; transform: none; }

    .drawer-head {
      flex: 0 0 auto;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 26px 16px;
      border-bottom: 1px solid var(--border-soft);
    }

    .drawer-heading { min-width: 0; }

    .drawer-kicker {
      font-size: 10px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .drawer-title {
      margin-top: 6px;
      font-family: var(--font-display-ui);
      font-size: 23px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.03em;
      color: var(--fg);
      overflow-wrap: anywhere;
    }

    .drawer-path {
      margin-top: 5px;
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.5;
      color: var(--meta);
      overflow-wrap: anywhere;
    }

    .drawer-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }

    .drawer-reveal,
    .drawer-close {
      appearance: none;
      display: grid;
      place-items: center;
      height: 36px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--card);
      color: var(--fg-2);
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition:
        background-color var(--motion-fast) var(--ease-standard),
        border-color var(--motion-fast) var(--ease-standard);
    }

    .drawer-close { width: 36px; padding: 0; }
    .drawer-reveal:hover,
    .drawer-close:hover { background: var(--surface); border-color: var(--meta); }
    .drawer-reveal:focus-visible,
    .drawer-close:focus-visible { outline: none; box-shadow: var(--focus-ring); }

    .drawer-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 4px 26px 56px;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .drawer-hint { margin-top: 24px; font-size: 13px; color: var(--muted); }

    /* ── Markdown 正文 ──────────────────────────────────────── */
    .markdown { color: var(--fg-2); font-size: 14px; line-height: 1.72; }
    .markdown > :first-child { margin-top: 20px; }

    .markdown .meta-grid {
      display: grid;
      grid-template-columns: 104px minmax(0, 1fr);
      gap: 7px 16px;
      margin: 18px 0 24px;
      padding: 16px 18px;
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      background: var(--surface-warm);
    }

    .markdown .meta-grid dt {
      padding-top: 2px;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.5;
      letter-spacing: 0.03em;
      color: var(--muted);
    }

    .markdown .meta-grid dd {
      margin: 0;
      font-size: 13px;
      line-height: 1.6;
      color: var(--fg-2);
      overflow-wrap: anywhere;
    }

    @media (max-width: 700px) {
      .markdown .meta-grid { grid-template-columns: minmax(0, 1fr); gap: 2px; padding: 14px; }
      .markdown .meta-grid dd { margin-bottom: 10px; }
    }
    .markdown h2 {
      margin: 30px 0 10px;
      font-family: var(--font-display-ui);
      font-size: 20px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.022em;
      color: var(--fg);
    }
    .markdown h3 {
      margin: 24px 0 8px;
      font-family: var(--font-display-ui);
      font-size: 16px;
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: -0.015em;
      color: var(--fg);
    }
    .markdown h4 { margin: 18px 0 6px; font-size: 14px; font-weight: 600; color: var(--fg); }
    .markdown p { margin: 10px 0; }
    .markdown ul,
    .markdown ol { margin: 10px 0; padding-left: 22px; }
    .markdown li { margin: 4px 0; }
    .markdown li.nested { list-style: circle; margin-left: 14px; }
    .markdown strong { color: var(--fg); font-weight: 600; }
    .markdown em { font-style: italic; }
    .markdown code {
      font-family: var(--font-mono);
      font-size: 0.88em;
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: 6px;
      padding: 1px 5px;
    }
    .markdown pre {
      margin: 14px 0;
      padding: 14px 16px;
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      background: var(--surface-warm);
      overflow-x: auto;
    }
    .markdown pre code { padding: 0; border: 0; background: none; font-size: 12.5px; line-height: 1.6; }
    .markdown blockquote {
      margin: 14px 0;
      padding: 8px 14px;
      border-left: 3px solid var(--border);
      border-radius: 0 8px 8px 0;
      background: var(--surface-warm);
      color: var(--muted);
    }
    .markdown hr { margin: 24px 0; border: 0; border-top: 1px solid var(--border-soft); }
    .markdown table {
      width: 100%;
      margin: 14px 0;
      border-collapse: collapse;
      font-size: 13px;
      line-height: 1.55;
    }
    .markdown th,
    .markdown td { padding: 7px 10px; border: 1px solid var(--border-soft); text-align: left; vertical-align: top; }
    .markdown th { background: var(--surface); font-weight: 600; color: var(--fg); white-space: nowrap; }
    .markdown a { color: var(--accent); text-decoration: none; }
    .markdown a:hover { text-decoration: underline; }

    @media (max-width: 900px) {
      .drawer-panel { width: min(620px, 100%); }
    }

    @media (max-width: 700px) {
      .drawer-head { padding: 16px 16px 12px; }
      .drawer-body { padding: 2px 16px 40px; }
      .drawer-title { font-size: 20px; }
      .drawer-reveal { display: none; }
      .markdown .meta-grid { grid-template-columns: minmax(0, 1fr); gap: 2px; padding: 14px; }
      .markdown .meta-grid dd { margin-bottom: 10px; }
      .doc-row { flex-wrap: wrap; }
      .doc-path { white-space: normal; overflow-wrap: anywhere; word-break: break-all; }
    }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 1100px) {
      .app-header { padding: 16px 20px; }
      .board-area { padding: 16px 20px 20px; }
      .header-top { flex-wrap: wrap; row-gap: 10px; }
      .header-aside { margin-left: auto; }
    }

    @media (max-width: 900px) {
      .board { grid-auto-columns: max(180px, calc((100% - 12px) * 0.3)); }
      .header-top { gap: 16px; }
      .generated { font-size: 10.5px; }
      .header-lead { gap: 12px; }
    }

    @media (max-width: 700px) {
      .stage { padding: 12px; }
      .app-shell { border-radius: 20px; }
      .app-header { padding: 16px 16px 14px; }
      .board-area { padding: 12px; }
      .board-panel { padding: 8px; border-radius: 16px; }
      .header-top { flex-wrap: wrap; gap: 10px 12px; }
      .header-lead { flex-wrap: wrap; gap: 10px; flex: 1 1 100%; }
      .header-aside { justify-content: flex-end; margin-left: auto; }
      .generated { padding-top: 0; text-align: left; }
      .identity { gap: 12px; }
      .app-shell.is-gallery .header-top { flex-direction: row; align-items: center; gap: 12px; }
      .board.is-gallery { gap: 12px; }
      .gallery-tile { border-radius: 12px; }
      .brandmark { width: 32px; height: 32px; border-radius: 10px; }
      .brandmark svg { width: 24px; height: 24px; }
      .controls { gap: 6px; }
      .count-pill { margin-left: 0; margin-right: 0; }
      .project { padding: 16px 16px 12px; border-radius: 14px; }
      .block { margin-top: 16px; }
      .why { font-size: 13.5px; min-height: 6.4em; }
    }

    @media (max-width: 480px) {
      .stage { padding: 8px; }
      .app-shell { border-radius: 16px; }
      .app-header { padding: 16px 12px 12px; }
      .board-area { padding: 8px; }
      .board-panel { padding: 8px; border-radius: 14px; }
      .board.is-gallery { grid-template-columns: repeat(auto-fit, 128px); gap: 10px; }
      .gallery-stage { padding-top: 7px; }
      .gallery-name { font-size: 14px; -webkit-line-clamp: 2; }
      .gallery-stage-name { font-size: 12px; }
      .project { padding: 16px 12px 12px; }
      .project-title { font-size: 24px; }
      .why { font-size: 13.5px; min-height: 6.4em; }
      .stage-name { font-size: 18px; }
      .block { margin-top: 16px; }
      .project-footer { font-size: 10.5px; }
      .sort-button { padding-inline: 10px; }
    }

    @media (max-height: 700px) {
      .app-header { padding-top: 16px; }
      .board-area { padding-top: 12px; }
      .project { padding-top: 16px; }
      .block { margin-top: 16px; }
      .gate { -webkit-line-clamp: 1; }
    }

    /* ── Touch ─────────────────────────────────────────────────
       触屏设备（手机、平板）：横向一屏一张卡并吸附，左右滑动切换项目；
       卡片内容超高时在卡片内部纵向滚动。pointer: fine 的桌面不受影响。 */
    @media (pointer: coarse) {
      .board-scroller {
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
      }

      .board { grid-auto-columns: min(560px, calc(100% - 20px)); }

      .project { scroll-snap-align: start; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
      .project-title.is-scrolling .title-track { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="app-shell">
      <header class="app-header" aria-label="Hands-off Dashboard header and toolbar">
        <div class="header-top">
          <div class="header-lead">
            <div class="identity">
              <span class="brandmark" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <g class="monogram" fill="currentColor" text-anchor="middle" font-size="10.5">
                    <text x="6.75" y="10.5">H</text>
                    <text x="17.25" y="10.5">O</text>
                    <text x="6.75" y="21">D</text>
                    <text x="17.25" y="21">B</text>
                  </g>
                </svg>
              </span>
              <h1 class="sr-only">Hands-off Dashboard</h1>
            </div>
            <div class="controls" id="controls">
              <span class="toolbar-label">Sort</span>
              <div class="segmented" role="group" aria-label="Sort by">
                <button class="sort-button" type="button" data-sort="created" aria-pressed="true">Created</button>
                <button class="sort-button" type="button" data-sort="lastActivity" aria-pressed="false">Last activity</button>
              </div>
              <button class="direction-button" id="directionButton" type="button" aria-label="Sorted descending. Switch to ascending.">
                <svg class="od-icon icon-arrow sort-arrow" id="sortArrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M8 3v10M4.5 9.5 8 13l3.5-3.5" />
                </svg>
                <span id="directionLabel">Descending</span>
              </button>
            </div>
          </div>

          <div class="header-aside">
            <span class="demo-badge" id="demoBadge" hidden>示例数据</span>
            <div class="generated">
              Data generated <strong><time id="readTime" datetime="">—</time></strong>
            </div>
            <span class="count-pill project-count" id="projectCount">—</span>
            <div class="count-pill gallery-meta" id="galleryMeta">
              <span id="galleryCount">—</span>
            </div>
            <button
              class="view-switch"
              id="viewSwitch"
              type="button"
              aria-label="切换到方格视图"

    /* ── Local preferences ───────────────────────────────────── */

    function loadPinned() {
      let stored = null;
      try {
        stored = window.localStorage.getItem(PIN_STORAGE_KEY);
      } catch (error) {
        stored = null;
      }

      if (stored === null) {
        return new Set();
      }

      try {
        const parsed = JSON.parse(stored);
        return new Set(Array.isArray(parsed) ? parsed : []);
      } catch (error) {
        return new Set();
      }
    }

    function savePinned() {
      try {
        window.localStorage.setItem(PIN_STORAGE_KEY, JSON.stringify([...state.pinned]));
      } catch (error) {
        // The in-memory Set still keeps the current interaction working.
      }
    }

    /* ── Helpers ─────────────────────────────────────────────── */

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (character) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[character]));
    }

    // DOM id / aria-labelledby / aria-controls 专用的 safe id。
    // aria-labelledby 是按空白拆分的 IDREF 列表，项目 id 里若含空格
    // （例如去重后的 "rootA/同名项目 #2"）会被拆成多个引用而全部失效。
    // 只替换空白（IDREF 的唯一硬约束），保留中文等字符，避免纯中文项目名
    // 全部塌缩成同一个 id。data-pin-id / data-doc-id 保留原始 id，
    // 它们走 dataset 比较，不受影响。
    function domId(value) {
      return 'd-' + String(value).replace(/\s+/g, '-');
    }

    function dateValue(value) {
      if (!value) return null;
      const timestamp = Date.parse(`${value}T00:00:00`);
      return Number.isNaN(timestamp) ? null : timestamp;
    }

    function pad(number) {
      return String(number).padStart(2, '0');
    }

    function stampValue(date) {
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    function stampLabel(date) {
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    function currentStageIndex(project) {
      if (!project.current || !Array.isArray(project.stages)) return -1;
      return project.stages.indexOf(project.current);
    }

    function stageProgress(project) {
      const index = currentStageIndex(project);
      const total = Array.isArray(project.stages) ? project.stages.length : 0;
      if (index < 0 || total === 0) return '';
      return `${index + 1}/${total}`;
    }

    function demoHandoffMarkdown(project) {
      const rows = [
        ['Audience', project.audience],
        ['Why', project.why],
        ['Stages', Array.isArray(project.stages) && project.stages.length ? project.stages.join(' → ') : null],
        ['Current', project.current],
        ['Evidence', project.evidence],
        ['Gate', project.gate],
        ['Blocker', project.blocker],
        [
          'Next-Determined',
          project.nextDetermined === true
            ? 'DETERMINED'
            : project.nextDetermined === false
              ? 'UNDETERMINED'
              : null
        ],
        ['Next', project.next],
        ['Created', project.created],
        ['Last-Activity', project.lastActivity]
      ].filter(([, value]) => Boolean(value));

      const header = rows.map(([key, value]) => `${key}: ${value}`).join('\n');
      return `${header}${header ? '\n\n' : ''}# Handoff: ${project.name}\n\n> 这是原型预览使用的示例数据。接入本地服务后，这里会显示真实的交接文档。`;
    }

    /* ── Icons ───────────────────────────────────────────────── */

    function pinIcon() {
      return `
        <svg class="od-icon icon-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

    function arrowIcon() {
      return `
        <svg class="od-icon icon-arrow action-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 8h10M9.5 4.5 13 8l-3.5 3.5" />

    function warningIcon() {
      return `
        <svg class="od-icon icon-warning" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="10" cy="10" r="7.2" />

          <path d="M10 13.6h.01" />

    }

    function chevronIcon() {
      return `
        <svg class="od-icon icon-chevron chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m4 6 4 4 4-4" />
        </svg>
      `;
    }

    /* ── Data ────────────────────────────────────────────────── */

    async function loadProjects({ silent = false } = {}) {
      if (!silent) {
        state.loading = true;
        render();
      }

      let liveProjects = null;

      try {
        const response = await fetch(API_PROJECTS, { cache: 'no-store' });
        if (!response.ok) throw new Error(`Request failed with HTTP ${response.status}`);
        const payload = await response.json();
        const list = Array.isArray(payload) ? payload : payload && payload.projects;

        // 预览环境的静态服务可能对 /api/projects 返回 200 + 空结果或非预期结构，
        // 这种“看起来成功但没有项目”的情况同样要落到示例数据上。
        if (Array.isArray(list) && list.length > 0) liveProjects = list;
      } catch (error) {
        liveProjects = null;
      }

      // 原型预览兜底：接口不可用、返回空列表或结构不符时，统一用 6 个虚拟占位项目。
      // 桌面端返回真实项目时，这份示例数据不会出现。
      state.demo = liveProjects === null;
      state.projects = state.demo ? DEMO_PROJECTS : liveProjects;
      state.readAt = new Date();
      state.error = null;
      state.loading = false;
      render();
      els.status.textContent = state.demo
        ? `已载入 ${state.projects.length} 个示例项目`
        : `Loaded ${state.projects.length} ${state.projects.length === 1 ? 'project' : 'projects'}`;
    }

    function sortedProjects() {
      return [...state.projects].sort((a, b) => {
        // Cards that failed to load stay at the end.
        if (Boolean(a.error) !== Boolean(b.error)) return a.error ? 1 : -1;

        const aPinned = state.pinned.has(a.id);
        const bPinned = state.pinned.has(b.id);
        if (aPinned !== bPinned) return aPinned ? -1 : 1;

        const aDate = dateValue(a[state.sortField]);
        const bDate = dateValue(b[state.sortField]);

        if (aDate === null && bDate === null) {
          return a.name.localeCompare(b.name, 'zh-CN');
        }
        if (aDate === null) return 1;
        if (bDate === null) return -1;

        const difference = aDate - bDate;
        return state.direction === 'asc' ? difference : -difference;
      });
    }

    /* ── Card ────────────────────────────────────────────────── */

    function progressMarkup(project) {
      if (!project.current) {
        return `<p class="stage-name placeholder" aria-label="Stage not defined">Stage not defined</p>`;
      }

      const count = stageProgress(project);
      const countMarkup = count ? `<span class="stage-count">${escapeHtml(count)}</span>` : '';
      return `
        <div class="stage-line">
          <p class="stage-name" title="${escapeHtml(project.current)}" lang="zh-CN">${escapeHtml(project.current)}</p>
          ${countMarkup}
        </div>
      `;
    }

    function nextMarkup(project) {
      if (project.nextDetermined === false) {
        return `
          <div class="undetermined">
            ${warningIcon()}
            <span>Next step undecided</span>
          </div>
        `;
      }

      const gateMarkup = project.gate
        ? `<p class="gate" title="${escapeHtml(project.gate)}" lang="zh-CN">${escapeHtml(project.gate)}</p>`
        : '';

      if (!project.next) {
        return `${gateMarkup}<p class="next-action is-placeholder"><span class="action-text">Next step not defined</span></p>`;
      }

      return `
        ${gateMarkup}
        <div class="next-action">
          ${project.gate ? arrowIcon() : ''}
          <span class="action-text" title="${escapeHtml(project.next)}" lang="zh-CN">${escapeHtml(project.next)}</span>
        </div>
      `;
    }

    function footerMarkup(project) {
      const hasLast = Boolean(project.lastActivity);
      const hasCreated = Boolean(project.created);

      if (!hasLast && !hasCreated) {
        return `<span class="time-item placeholder">Dates not recorded</span>`;
      }

      const last = hasLast
        ? `<span class="time-item">Last activity <time datetime="${escapeHtml(project.lastActivity)}">${escapeHtml(project.lastActivity)}</time></span>`
        : `<span class="time-item placeholder">Last activity not recorded</span>`;

      const created = hasCreated
        ? `<span class="time-item">Created <time datetime="${escapeHtml(project.created)}">${escapeHtml(project.created)}</time></span>`
        : `<span class="time-item placeholder">Created not recorded</span>`;

      return `${last}<span class="footer-sep" aria-hidden="true">·</span>${created}`;
    }

    function projectMarkup(project) {
      if (project.error) return errorCardMarkup(project);

      const isPinned = state.pinned.has(project.id);
      const pinLabel = isPinned ? `Unpin ${project.name}` : `Pin ${project.name}`;
      const titleId = `project-title-${domId(project.id)}`;
      const whyId = `why-${domId(project.id)}`;
      const titleMarkup = `
        <span class="title-track">
          <span class="title-text">${escapeHtml(project.name)}</span>
          <span class="title-text" aria-hidden="true">${escapeHtml(project.name)}</span>
        </span>
      `;
      const whyToggle = project.why
        ? `
          <button
            class="why-toggle"
            type="button"
            hidden
            aria-expanded="false"
            aria-controls="${whyId}"
            aria-label="Show full why"
            title="Show full why"
          >
            ${chevronIcon()}
          </button>
        `
        : '';
      const whyMarkup = project.why
        ? `
          <div class="why-wrap">
            <p class="why" id="${whyId}" title="${escapeHtml(project.why)}" lang="zh-CN">${escapeHtml(project.why)}</p>
            ${whyToggle}
          </div>
        `
        : `<p class="why placeholder">Why not provided</p>`;

      const evidenceMarkup = project.evidence
        ? `<p class="evidence" title="${escapeHtml(project.evidence)}" lang="zh-CN">${escapeHtml(project.evidence)}</p>`
        : `<p class="evidence placeholder">No evidence recorded</p>`;

      const relPath = project.handoff ? project.handoff.relPath : '交接文档';
      const docTitle = project.handoff
        ? `${project.handoff.relPath} · ${Math.round(project.handoff.bytes / 102.4) / 10} KB`
        : '';

      return `
        <article class="project" aria-labelledby="${titleId}">
          <div class="project-head">
            <h2 class="project-title" id="${titleId}" title="${escapeHtml(project.name)}" lang="zh-CN">${titleMarkup}</h2>
            <button
              class="pin"
              type="button"
              data-pin-id="${escapeHtml(project.id)}"
              aria-pressed="${isPinned}"
              aria-label="${escapeHtml(pinLabel)}"
              title="${escapeHtml(pinLabel)}"
            >
              ${pinIcon()}
            </button>
          </div>

          <div class="doc-row">
            <button class="doc-link" type="button" data-doc-id="${escapeHtml(project.id)}" aria-label="查看 ${escapeHtml(project.name)} 的交接全文">
              查看全文
            </button>
            <span class="doc-path" title="${escapeHtml(docTitle)}">${escapeHtml(relPath)}</span>
          </div>

          ${whyMarkup}

          <section class="block" aria-label="Stage progress">
            <p class="block-label">Stage</p>
            ${progressMarkup(project)}
            ${evidenceMarkup}
          </section>

          <section class="block" aria-label="Next step">
            <p class="block-label">Next step</p>
            ${nextMarkup(project)}
          </section>

          <footer class="project-footer">
            ${footerMarkup(project)}
          </footer>
        </article>
      `;
    }

    /** 展示页的方格：只保留项目名与当前阶段，右上角带同源的置顶按钮。 */
    function galleryTileMarkup(project) {

      return `

          <div class="gallery-head">

            <button
              class="pin pin-tile"
              type="button"
              data-pin-id="${escapeHtml(project.id)}"
              aria-pressed="${isPinned}"
              aria-label="${escapeHtml(pinLabel)}"
              title="${escapeHtml(pinLabel)}"
            >
              ${pinIcon()}
            </button>
          </div>
          <div class="gallery-stage">
            <span class="gallery-stage-label"><span class="gallery-stage-dot" aria-hidden="true"></span>${stageLabel}</span>
            <p class="gallery-stage-name${isPlaceholder ? ' is-placeholder' : ''}" title="${escapeHtml(stageTitle)}" lang="zh-CN">${escapeHtml(stageText)}</p>
          </div>
        </article>

    }

    /** 读不到交接文档时，仍然用同一套卡片骨架，只是字段都是占位。 */

      return `
        <article class="project">
          <div class="project-head">
            <h2 class="project-title" title="${escapeHtml(project.name)}" lang="zh-CN">
              <span class="title-track"><span class="title-text">${escapeHtml(project.name)}</span></span>
            </h2>
          </div>
          <p class="why placeholder">Why not provided</p>
          <section class="block" aria-label="Stage progress">

            <p class="stage-name placeholder">Stage not defined</p>

          <section class="block" aria-label="Next step">

    function emptyMarkup() {

        <div class="empty-state">

              <path d="M8 3.5h8l4 4v17H8z" />
              <path d="M16 3.5v4h4" />
              <path d="M11 13h6M11 17h4" />
            </svg>
          </div>
          <h2 class="empty-title">No projects to show</h2>
          <p class="empty-copy">No project folders with a readable handoff were found. Folders without a handoff are not shown.</p>

    }

    function loadingMarkup() {
      return `
        <div class="empty-state">
          <div class="empty-mark" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3.5h8l4 4v17H8z" />
              <path d="M16 3.5v4h4" />
              <path d="M11 13h6M11 17h4" />
            </svg>
          </div>
          <h2 class="empty-title">Reading handoffs</h2>
          <p class="empty-copy">Scanning project folders and parsing the structured header of each handoff.</p>
        </div>
      `;

    function errorMarkup(message) {
      return `
        <div class="empty-state">
          <div class="empty-mark" aria-hidden="true">
            ${warningIcon()}
          </div>
          <h2 class="empty-title">No data from the local service</h2>
          <p class="empty-copy">${escapeHtml(message)}</p>
        </div>
      `;
    }

    /* ── Render ──────────────────────────────────────────────── */

    function updateControls() {
      document.querySelectorAll('.sort-button').forEach((button) => {
        const selected = button.dataset.sort === state.sortField;
        button.setAttribute('aria-pressed', String(selected));
      });

      const isAscending = state.direction === 'asc';
      els.directionLabel.textContent = isAscending ? 'Ascending' : 'Descending';
      els.sortArrow.classList.toggle('is-ascending', isAscending);
      els.directionButton.setAttribute(
        'aria-label',
        isAscending
          ? 'Sorted ascending. Switch to descending.'
          : 'Sorted descending. Switch to ascending.'
      );
    }

    function updateViewSwitch() {
      const isGallery = state.view === 'gallery';
      const action = isGallery ? '切换到看板视图' : '切换到方格视图';
      els.viewSwitch.setAttribute('aria-label', action);
      els.viewSwitch.title = action;
    }

    function setupCardOverflow() {
      if (state.view === 'gallery') return;

      document.querySelectorAll('.project').forEach((card) => {
        const title = card.querySelector('.project-title');
        if (title) {
          const track = title.querySelector('.title-track');
          const firstText = title.querySelector('.title-text');
          if (track && firstText) {
            title.classList.remove('is-scrolling');
            track.style.removeProperty('--title-shift');
            track.style.removeProperty('--title-duration');

            const overflows = firstText.scrollWidth > title.clientWidth + 1;
            if (overflows) {
              const gap = 32;
              const shift = firstText.scrollWidth + gap;
              track.style.setProperty('--title-shift', `${shift}px`);
              track.style.setProperty('--title-duration', `${Math.max(8, shift / 30)}s`);
              title.classList.add('is-scrolling');
            }
          }
        }

        const why = card.querySelector('.why');
        const toggle = card.querySelector('.why-toggle');
        if (!why || !toggle) return;

        if (toggle.getAttribute('aria-expanded') === 'true') {
          toggle.hidden = false;
          return;
        }

        toggle.hidden = why.scrollHeight <= why.clientHeight + 1;
      });
    }

    function render() {
      if (state.readAt) {
        els.readTime.textContent = stampLabel(state.readAt);
        els.readTime.setAttribute('datetime', stampValue(state.readAt));
      }

      const isGallery = state.view === 'gallery';
      els.appShell.classList.toggle('is-gallery', isGallery);
      els.demoBadge.hidden = !state.demo;
      els.demoBadge.textContent = `示例数据 · ${DEMO_PROJECTS.length} 个占位项目`;
      els.boardScroller.setAttribute(
        'aria-label',
        isGallery ? 'Project gallery, square tiles' : 'Project list, horizontally scrollable'
      );
      updateViewSwitch();

      if (state.loading) {
        els.projectCount.textContent = 'Reading…';
        els.galleryCount.textContent = '读取中…';
        els.controls.hidden = true;
        els.board.className = 'board is-empty';
        els.board.innerHTML = loadingMarkup();
        return;
      }

      if (state.error) {
        els.projectCount.textContent = 'Read failed';
        els.galleryCount.textContent = '读取失败';
        els.controls.hidden = true;
        els.board.className = 'board is-empty';
        els.board.innerHTML = errorMarkup(state.error);
        return;
      }

      const projects = sortedProjects();
      const isEmpty = projects.length === 0;

      els.projectCount.textContent = `${projects.length} ${projects.length === 1 ? 'project' : 'projects'}`;
      els.galleryCount.textContent = `${projects.length} 个项目`;
      els.controls.hidden = isEmpty;
      els.board.className = 'board';

      if (isEmpty) {
        els.board.classList.add('is-empty');
        els.board.innerHTML = emptyMarkup();
      } else if (isGallery) {
        els.board.classList.add('is-gallery');
        els.board.innerHTML = projects.map(galleryTileMarkup).join('');
      } else {
        els.board.innerHTML = projects.map(projectMarkup).join('');
      }

      updateControls();
      window.requestAnimationFrame(setupCardOverflow);

      const requestedDoc = new URLSearchParams(window.location.search).get('doc');
      if (requestedDoc && !state.drawerId && !state.pendingDoc) {
        const match = projects.find((item) => item.id === requestedDoc && item.handoff);
        if (match) {
          state.pendingDoc = true;
          openDrawer(match.id);
        }
      }
    }

    function focusPin(projectId) {
      window.requestAnimationFrame(() => {
        const nextPin = document.querySelector(`.pin[data-pin-id="${CSS.escape(String(projectId))}"]`);
        if (nextPin) nextPin.focus();
      });
    }

    /* ── 交接全文抽屉 ─────────────────────────────────────────── */

    function inlineMarkup(text) {
      let output = escapeHtml(text);
      output = output.replace(/`([^`]+)`/g, (match, code) => `<code>${code}</code>`);
      output = output.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (match, label, href) => {
        const safe = /^(https?:|mailto:|#|\/)/i.test(href) ? href : '#';
        return `<a href="${safe}" target="_blank" rel="noreferrer noopener">${label}</a>`;
      });
      output = output.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      output = output.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
      output = output.replace(
        /(^|[\s（(])(https?:\/\/[^\s<]+)/g,
        (match, prefix, url) => {
          const trimmed = url.replace(/[),.;:!?，。；：）】”"']+$/, '');
          const tail = url.slice(trimmed.length);
          return `${prefix}<a href="${trimmed}" target="_blank" rel="noreferrer noopener">${trimmed}</a>${tail}`;
        }
      );
      return output;
    }

    function splitTableRow(row) {
      return row
        .trim()
        .replace(/^\|/, '')
        .replace(/\|$/, '')
        .split('|')
        .map((cell) => cell.trim());
    }

    function isTableStart(lines, index) {
      return (
        /^\s*\|/.test(lines[index] || '') &&
        /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[index + 1] || '')
      );
    }

    function startsBlock(line) {
      return (
        /^(#{1,6})\s+/.test(line) ||
        /^\s*[-*+]\s+/.test(line) ||
        /^\s*\d+[.)]\s+/.test(line) ||
        /^\s*```/.test(line) ||
        /^\s*>/.test(line) ||
        /^\s*\|/.test(line) ||
        /^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)
      );
    }

    function renderMarkdown(markdown) {
      const lines = String(markdown).replace(/\r\n/g, '\n').split('\n');
      const html = [];
      let skippedTitle = false;

      // 文档开头那段 11 行 `Key: value` 结构化头，单独渲染成信息面板，而不是一大段文字。
      const metaLine = /^([A-Za-z][A-Za-z0-9 _-]{1,30}):\s*(.*)$/;
      const metaPairs = [];
      let metaIndex = 0;
      while (metaIndex < lines.length && metaLine.test(lines[metaIndex])) {
        const match = lines[metaIndex].match(metaLine);
        metaPairs.push([match[1], match[2].trim()]);
        metaIndex += 1;
      }

      let index;
      if (metaPairs.length >= 4) {
        html.push(
          `<dl class="meta-grid">${metaPairs
            .map(([key, value]) => `<dt>${escapeHtml(key)}</dt><dd>${inlineMarkup(value) || '—'}</dd>`)
            .join('')}</dl>`
        );
        index = metaIndex;
      } else {
        index = 0;
      }

      while (index < lines.length) {
        const line = lines[index];

        if (!line.trim()) {
          index += 1;
          continue;
        }

        if (/^\s*```/.test(line)) {
          const language = line.replace(/^\s*```/, '').trim();
          const buffer = [];
          index += 1;
          while (index < lines.length && !/^\s*```/.test(lines[index])) {
            buffer.push(lines[index]);
            index += 1;
          }
          index += 1;
          const languageClass = language ? ` class="language-${escapeHtml(language)}"` : '';
          html.push(`<pre><code${languageClass}>${escapeHtml(buffer.join('\n'))}</code></pre>`);
          continue;
        }

        const heading = line.match(/^(#{1,6})\s+(.*)$/);
        if (heading) {
          const level = heading[1].length;
          index += 1;
          if (level === 1 && !skippedTitle) {
            skippedTitle = true;
            continue;
          }
          const tag = `h${Math.min(Math.max(level, 2), 4)}`;
          html.push(`<${tag}>${inlineMarkup(heading[2])}</${tag}>`);
          continue;
        }

        if (/^\s*[-*+]\s+/.test(line)) {
          const items = [];
          while (index < lines.length && /^\s*[-*+]\s+/.test(lines[index])) {
            const raw = lines[index];
            items.push({
              indent: raw.match(/^\s*/)[0].length,
              text: raw.replace(/^\s*[-*+]\s+/, '')
            });
            index += 1;
          }
          const baseIndent = Math.min(...items.map((item) => item.indent));
          html.push(
            `<ul>${items
              .map(
                (item) =>
                  `<li${item.indent > baseIndent + 1 ? ' class="nested"' : ''}>${inlineMarkup(item.text)}</li>`
              )
              .join('')}</ul>`
          );
          continue;
        }

        if (/^\s*\d+[.)]\s+/.test(line)) {
          const items = [];
          while (index < lines.length && /^\s*\d+[.)]\s+/.test(lines[index])) {
            items.push(lines[index].replace(/^\s*\d+[.)]\s+/, ''));
            index += 1;
          }
          html.push(`<ol>${items.map((item) => `<li>${inlineMarkup(item)}</li>`).join('')}</ol>`);
          continue;
        }

        if (isTableStart(lines, index)) {
          const head = splitTableRow(lines[index]);
          index += 2;
          const rows = [];
          while (index < lines.length && /^\s*\|/.test(lines[index])) {
            rows.push(splitTableRow(lines[index]));
            index += 1;
          }
          const thead = `<thead><tr>${head.map((cell) => `<th>${inlineMarkup(cell)}</th>`).join('')}</tr></thead>`;
          const tbody = `<tbody>${rows
            .map((row) => `<tr>${row.map((cell) => `<td>${inlineMarkup(cell)}</td>`).join('')}</tr>`)
            .join('')}</tbody>`;
          html.push(`<table>${thead}${tbody}</table>`);
          continue;
        }

        if (/^\s*>/.test(line)) {
          const buffer = [];
          while (index < lines.length && /^\s*>/.test(lines[index])) {
            buffer.push(lines[index].replace(/^\s*>\s?/, ''));
            index += 1;
          }
          html.push(`<blockquote>${buffer.map(inlineMarkup).join('<br>')}</blockquote>`);
          continue;
        }

        if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
          html.push('<hr>');
          index += 1;
          continue;
        }

        const buffer = [line];
        index += 1;
        while (index < lines.length && lines[index].trim() && !startsBlock(lines[index])) {
          buffer.push(lines[index]);
          index += 1;
        }
        html.push(`<p>${buffer.map(inlineMarkup).join('<br>')}</p>`);
      }

      return html.join('\n');
    }

    async function openDrawer(projectId) {
      const project = state.projects.find((item) => item.id === projectId);
      if (!project) return;

      state.drawerId = projectId;
      state.lastFocus = document.activeElement;

      els.drawerKicker.textContent = project.handoff && project.handoff.title
        ? project.handoff.title
        : '交接文档';
      els.drawerTitle.textContent = project.name;
      els.drawerPath.textContent = project.handoff ? `${project.handoff.relPath}` : '';
      els.drawerBody.innerHTML = '<p class="drawer-hint">读取中…</p>';
      els.drawerReveal.hidden = state.demo || !project.handoff;

      els.drawer.hidden = false;
      els.drawer.setAttribute('aria-hidden', 'false');
      window.requestAnimationFrame(() => els.drawer.classList.add('is-open'));
      els.drawerClose.focus();

      if (state.demo) {
        els.drawerBody.innerHTML = renderMarkdown(demoHandoffMarkdown(project));
        els.drawerBody.scrollTop = 0;
        return;
      }

      try {
        const response = await fetch(`/api/handoff?id=${encodeURIComponent(projectId)}`, {
          cache: 'no-store'
        });
        if (!response.ok) throw new Error(`接口返回 HTTP ${response.status}`);
        const data = await response.json();
        if (state.drawerId !== projectId) return;
        els.drawerBody.innerHTML = renderMarkdown(data.markdown || '');
        els.drawerBody.scrollTop = 0;
      } catch (error) {
        if (state.drawerId !== projectId) return;
        els.drawerBody.innerHTML = `<p class="drawer-hint">读取失败：${escapeHtml(error.message)}</p>`;
      }
    }

    function closeDrawer() {
      if (els.drawer.hidden) return;
      state.drawerId = null;
      els.drawer.classList.remove('is-open');
      els.drawer.setAttribute('aria-hidden', 'true');

      window.setTimeout(() => {
        if (!els.drawer.classList.contains('is-open')) els.drawer.hidden = true;
      }, 220);

      if (state.lastFocus && typeof state.lastFocus.focus === 'function') {
        state.lastFocus.focus();
      }
      state.lastFocus = null;
    }

    /* ── Interaction ─────────────────────────────────────────── */

    els.board.addEventListener('click', (event) => {
      const docLink = event.target.closest('.doc-link');
      if (docLink) {
        openDrawer(docLink.dataset.docId);
        return;
      }

      const whyToggle = event.target.closest('.why-toggle');
      if (whyToggle) {
        const why = document.getElementById(whyToggle.getAttribute('aria-controls'));
        if (!why) return;

        const expanded = whyToggle.getAttribute('aria-expanded') === 'true';
        const nextExpanded = !expanded;
        const nextLabel = nextExpanded ? 'Show less' : 'Show full why';

        why.classList.toggle('is-expanded', nextExpanded);
        whyToggle.setAttribute('aria-expanded', String(nextExpanded));
        whyToggle.setAttribute('aria-label', nextLabel);
        whyToggle.title = nextLabel;
        return;
      }

      const pin = event.target.closest('.pin');
      if (!pin) return;

      const projectId = pin.dataset.pinId;
      const project = state.projects.find((item) => item.id === projectId);
      if (!project) return;

      const wasPinned = state.pinned.has(projectId);
      if (wasPinned) {
        state.pinned.delete(projectId);
      } else {
        state.pinned.add(projectId);
      }

      savePinned();
      render();
      focusPin(projectId);
      els.status.textContent = `${wasPinned ? '已取消置顶' : '已置顶'} ${project.name}`;
    });

    document.querySelectorAll('.sort-button').forEach((button) => {
      button.addEventListener('click', () => {
        const nextField = button.dataset.sort;
        if (state.sortField === nextField) return;
        state.sortField = nextField;
        render();
        els.status.textContent = `Sorted by ${nextField === 'created' ? 'created' : 'last activity'}, ${state.direction === 'asc' ? 'ascending' : 'descending'}`;
      });
    });

    els.directionButton.addEventListener('click', () => {
      state.direction = state.direction === 'asc' ? 'desc' : 'asc';
      render();
      els.status.textContent = `Sorted by ${state.sortField === 'created' ? 'created' : 'last activity'}, ${state.direction === 'asc' ? 'ascending' : 'descending'}`;
    });

    els.viewSwitch.addEventListener('click', () => {
      state.view = state.view === 'gallery' ? 'board' : 'gallery';
      render();
      els.boardScroller.scrollTop = 0;
      els.boardScroller.scrollLeft = 0;
      els.status.textContent = state.view === 'gallery' ? '已切换到方格视图' : '已切换到看板视图';
    });

    els.boardScroller.addEventListener('wheel', (event) => {
      if (state.view === 'gallery') return;
      if (event.ctrlKey) return;
      if (Math.abs(event.deltaX) >= Math.abs(event.deltaY)) return;

      const card = event.target.closest('.project');
      if (card) {
        const canScrollVertically = card.scrollHeight > card.clientHeight + 1;
        if (canScrollVertically) {
          const atTop = card.scrollTop <= 0;
          const atBottom = card.scrollTop + card.clientHeight >= card.scrollHeight - 1;
          if ((event.deltaY < 0 && !atTop) || (event.deltaY > 0 && !atBottom)) {
            return;
          }
        }
      }

      const delta = event.deltaY * (event.deltaMode === 1 ? 16 : 1);
      event.preventDefault();
      els.boardScroller.scrollLeft += delta;
    }, { passive: false });


    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeDrawer();
    });

    els.drawerScrim.addEventListener('click', closeDrawer);
    els.drawerClose.addEventListener('click', closeDrawer);

    els.drawerReveal.addEventListener('click', async () => {
      if (!state.drawerId) return;
      els.drawerReveal.disabled = true;
      try {
        await fetch(`/api/reveal?id=${encodeURIComponent(state.drawerId)}&target=handoff`);
      } finally {
        window.setTimeout(() => {
          els.drawerReveal.disabled = false;
        }, 600);
      }
    });

    let cardOverflowFrame = 0;
    window.addEventListener('resize', () => {
      window.cancelAnimationFrame(cardOverflowFrame);
      cardOverflowFrame = window.requestAnimationFrame(setupCardOverflow);
    });

    // 回来看板时静默重读，避免手动刷新页面。
    let lastReadAt = 0;
    function refreshIfStale() {
      if (document.visibilityState !== 'visible') return;
      if (Date.now() - lastReadAt < 30000) return;
      lastReadAt = Date.now();
      loadProjects({ silent: true });
    }

    document.addEventListener('visibilitychange', refreshIfStale);
    window.addEventListener('focus', refreshIfStale);

    // 桌面组件右键菜单「刷新」按钮：主进程在主世界派发本事件
    window.addEventListener('hs-refresh', () => {
      lastReadAt = Date.now();
      loadProjects({ silent: true });
    });
